<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Returning to EngiNear</title>
<style>
  :root { --blue: #EB692B; --ink: #16191D; --muted: #565D66; --bg: #F3F3F1; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #EAF1FF; --muted: #A9B7CC; --bg: #0B1424; --card: #13213A; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  .card { width: 100%; max-width: 420px; background: var(--card); border-radius: 20px; padding: 28px 24px; text-align: center;
    box-shadow: 0 10px 30px rgba(10, 91, 211, .12); }
  .dot { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: var(--muted); }
  a.btn { display: block; background: var(--blue); color: #fff; text-decoration: none; font-weight: 600; padding: 14px 18px; border-radius: 14px; }
</style>
</head>
<body>
  <main class="card">
    <div class="dot" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 id="title">Taking you back to EngiNear</h1>
    <p id="msg">If the app doesn’t open on its own, tap the button below.</p>
    <a class="btn" id="open" href="enginear://payouts-done">Open EngiNear</a>
  </main>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var to = params.get('to') || 'enginear://payouts-done';
    // Only ever send people back into the EngiNear app, never to other websites.
    if (!/^(enginear|exp|exps):\/\//i.test(to)) to = 'enginear://payouts-done';
    if (params.get('refresh')) {
      document.getElementById('title').textContent = 'That link expired';
      document.getElementById('msg').textContent = 'Go back to EngiNear and tap the payout button again to continue.';
    }
    document.getElementById('open').href = to;
    location.replace(to);
  })();
</script>
</body>
</html>
